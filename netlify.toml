[build]
  base = "neuri-next"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js server routes use Netlify's automatically managed Next.js adapter.
# Configure runtime secrets in Netlify, never in this file:
# SUPABASE_URL, SUPABASE_ANON_KEY, NEURI_DATA_KEY
